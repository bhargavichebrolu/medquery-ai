[project]
name = "medquery-api"
version = "0.1.0"
description = "MedQuery AI backend: a FastAPI service that reads the research archive read-only."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.4.0",
    "fastapi>=0.162.0",
    "numpy>=2.4.6",
    "sentence-transformers>=6.2.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra lists the reason for every skipped test in the summary.
# Tests that load real embedding models or call a real LLM are opt-in: run them with
# `pytest -m models` or `pytest -m llm` (the latter costs money; approve it first).
addopts = "-ra -m 'not models and not llm'"
markers = [
    "models: loads real embedding models from the local cache (opt-in: pytest -m models)",
    "llm: calls a real LLM API and costs money (opt-in: pytest -m llm)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
