[project]
name = "medquery"
version = "0.1.0"
description = "Modular RAG pipeline migrated from the NHS Healthcare RAG dissertation research."
requires-python = ">=3.11"
dependencies = [
    "langchain-text-splitters>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medquery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "archive: requires the local Healthcare_RAG research archive (skipped when absent)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
